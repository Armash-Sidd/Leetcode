<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode AutoSync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-group">
        <svg class="icon-sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
        <h1>LeetCode AutoSync</h1>
      </div>
      <p class="subtitle">Sync your solved problems directly to GitHub with AI insights.</p>
    </header>

    <div id="statusMessage" class="status-msg hidden"></div>

    <form id="settingsForm">
      <div class="form-group">
        <label for="githubToken">
          GitHub Personal Access Token <span class="required">*</span>
        </label>
        <input 
          type="password" 
          id="githubToken" 
          placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
          autocomplete="off"
          required
        />
        <span class="help-text">Requires <code>repo</code> scope permission</span>
      </div>

      <div class="form-group">
        <label for="githubRepo">
          Target Repository <span class="required">*</span>
        </label>
        <input 
          type="text" 
          id="githubRepo" 
          placeholder="username/leetcode-solutions" 
          autocomplete="off"
          required
        />
        <span class="help-text">Format: <code>owner/repository-name</code></span>
      </div>

      <div class="form-group">
        <label for="geminiKey">
          Gemini API Key <span class="optional">(Optional)</span>
        </label>
        <input 
          type="password" 
          id="geminiKey" 
          placeholder="AIzaSyxxxxxxxxxxxxxxxxxxxx" 
          autocomplete="off"
        />
        <span class="help-text">Used for auto-generating solution insights</span>
      </div>

      <div class="form-group toggle-group">
        <label class="toggle-label" for="enableAiSync">
          <span>Enable Gemini AI Insights</span>
          <input type="checkbox" id="enableAiSync" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="button-group">
        <button type="submit" id="saveBtn" class="btn btn-primary">
          Save Settings
        </button>
        <button type="button" id="clearBtn" class="btn btn-secondary">
          Clear
        </button>
      </div>

      <div class="button-group test-group">
        <button type="button" id="testGithubBtn" class="btn btn-test">
          <span class="btn-label">Test GitHub</span>
        </button>
        <button type="button" id="testGeminiBtn" class="btn btn-test">
          <span class="btn-label">Test Gemini</span>
        </button>
      </div>
    </form>

    <footer class="footer">
      <span class="badge">v1.0.0</span>
      <span>Manifest V3 • ES Modules</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
